<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroStack JARVIS</title>
    <style>
        body { background:#020617; color:#00f0ff; font-family:'Courier New', monospace; padding: 20px; }
        h1 { border-bottom: 2px solid #00f0ff; padding-bottom: 10px; }
        button {
            margin:5px; padding:10px 15px; background:transparent;
            border:1px solid #00f0ff; color:#00f0ff; cursor:pointer;
            transition: all 0.3s;
        }
        button:hover { background:#00f0ff; color:#020617; }
        .panel { border:1px solid #00f0ff; padding:15px; margin:15px 0; background: rgba(0, 240, 255, 0.05); }
        .status-val { color: #fff; font-weight: bold; }
        pre { background: #000; padding: 10px; border: 1px solid #333; overflow: auto; }
    </style>
</head>
<body>

    <h1>🧠 NEUROSTACK OS - JARVIS INTERFACE</h1>

    <div class="panel">
        <h2>📊 System Telemetry</h2>
        <div>RAM Free: <span id="ram" class="status-val">--</span> MB</div>
        <div>CPU Load (1/5/15m): <span id="cpu" class="status-val">--</span></div>
        <div>Uptime: <span id="uptime" class="status-val">--</span>s</div>
    </div>

    <div class="panel">
        <h2>🛠 Service Control</h2>
        <div>
            <strong>Ollama:</strong>
            <button onclick="cmd('start','ollama')">START</button>
            <button onclick="cmd('stop','ollama')">STOP</button>
        </div>
        <div>
            <strong>Jules:</strong>
            <button onclick="cmd('start','jules')">START</button>
            <button onclick="cmd('stop','jules')">STOP</button>
        </div>
        <div>
            <strong>Godmode:</strong>
            <button onclick="cmd('start','godmode')">START</button>
        </div>
        <div>
            <strong>MAD:</strong>
            <button onclick="cmd('start','mad')">START</button>
        </div>
    </div>

    <div class="panel">
        <h2>🤖 AI Agents</h2>
        <button onclick="runAgent()">EXECUTE AGENT LOOP</button>
        <div id="agent-status"></div>
    </div>

    <div class="panel">
        <h2>🧩 Plugins</h2>
        <pre id="plugins-list">No plugins loaded</pre>
    </div>

    <script>
        // Update this to your Tailscale IP if needed
        const API = "http://" + window.location.hostname + ":3001";
        const KEY = "neurostack-key";

        async function refresh() {
            try {
                const r = await fetch(API + "/status", { headers: { "x-api-key": KEY } });
                const data = await r.json();

                document.getElementById("ram").innerText = Math.round(data.ram / 1024 / 1024);
                document.getElementById("cpu").innerText = data.cpu.map(v => v.toFixed(2)).join(" / ");
                document.getElementById("uptime").innerText = data.uptime;

                document.getElementById("plugins-list").innerText = JSON.stringify(data.plugins, null, 2);
            } catch (e) {
                console.error("Telemetry failure", e);
            }
        }

        async function cmd(action, service) {
            try {
                const r = await fetch(`${API}/${action}/${service}`, {
                    method: "POST",
                    headers: { "x-api-key": KEY }
                });
                const res = await r.json();
                alert(res.message);
                refresh();
            } catch (e) {
                alert("Command failed");
            }
        }

        async function runAgent() {
            try {
                const r = await fetch(API + "/agent/run", {
                    method: "POST",
                    headers: { "x-api-key": KEY }
                });
                const res = await r.json();
                document.getElementById("agent-status").innerText = res.message;
            } catch (e) {
                alert("Agent execution failed");
            }
        }

        setInterval(refresh, 2000);
        refresh();
    </script>

</body>
</html>
