<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>NeuroStack Dashboard</title>
<style>
body { background:#020617;color:#00f0ff;font-family:monospace; padding: 20px;}
button { margin:5px;padding:10px;background:#0ea5e9;border:none; color:white; cursor:pointer;}
button:hover { background:#0284c7; }
.panel { border:1px solid #00f0ff;margin:10px 0;padding:15px; background: rgba(0, 240, 255, 0.05);}
pre { background: #000; padding: 10px; border: 1px solid #333; overflow: auto; color: #fff; max-height: 300px;}
select { background: #020617; color: #00f0ff; border: 1px solid #00f0ff; padding: 5px; }
h1, h2 { color: #00f0ff; text-shadow: 0 0 10px rgba(0, 240, 255, 0.5); }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.rejected { color: #ff4444; }
</style>
</head>

<body>

<h1>🧠 NeuroStack Control Plane</h1>

<div class="grid">
    <div class="panel">
        <h2>Cluster Management</h2>
        <select id="nodeSelect"></select>
        <button onclick="loadNodes()">Refresh Nodes</button>
        <div style="margin-top: 10px;">
            <button onclick="start('ollama')">Start Ollama</button>
            <button onclick="stop('ollama')">Stop Ollama</button>
            <button onclick="start('jules')">Start Jules</button>
            <button onclick="stop('jules')">Stop Jules</button>
        </div>
    </div>

    <div class="panel">
        <h2>AI CTO & Tasks</h2>
        <div id="aiStatus">Status: Active</div>
        <div id="tasks">Queue is empty</div>
    </div>
</div>

<div class="grid">
    <div class="panel">
        <h2>System Logs</h2>
        <pre id="logs">Loading logs...</pre>
        <button onclick="fetchLogs()">Refresh Logs</button>
    </div>

    <div class="panel">
        <h2>Rejected Plugins</h2>
        <div id="rejected" class="rejected">No rejections</div>
    </div>
</div>

<div class="panel">
<h2>Global Cluster Status</h2>
<pre id="status">Loading status...</pre>
</div>

<script>
const API = "http://" + window.location.hostname + ":3001";
const KEY = "neurostack-key";

let currentNode = "";

async function loadNodes(){
    try {
        const res = await fetch(API+"/cluster/nodes",{headers:{"x-api-key":KEY}});
        const nodes = await res.json();
        const sel = document.getElementById("nodeSelect");
        sel.innerHTML="";
        nodes.forEach(n=>{
            const opt=document.createElement("option");
            opt.value=n.name;
            opt.text=n.name + " (" + n.ip + ")";
            sel.appendChild(opt);
        });
        if (nodes.length > 0) currentNode = nodes[0].name;
        sel.onchange = () => currentNode = sel.value;
    } catch (e) {}
}

async function start(s){
    await fetch(`${API}/cluster/start/${s}/${currentNode}`,{method:"POST",headers:{"x-api-key":KEY}});
    refresh();
}

async function stop(s){
    await fetch(`${API}/cluster/stop/${s}/${currentNode}`,{method:"POST",headers:{"x-api-key":KEY}});
    refresh();
}

async function fetchLogs() {
    const res = await fetch(API+"/api/logs",{headers:{"x-api-key":KEY}});
    document.getElementById("logs").innerText = await res.text();
}

async function refresh(){
    try {
        const res = await fetch(API+"/cluster/status",{headers:{"x-api-key":KEY}});
        const data = await res.json();
        document.getElementById("status").innerText = JSON.stringify(data,null,2);

        const aiRes = await fetch(API+"/api/ai/status",{headers:{"x-api-key":KEY}});
        const aiData = await aiRes.json();
        document.getElementById("tasks").innerHTML = "<h3>Tasks</h3><ul>" +
            aiData.tasks.map(t => `<li>${t.title} - <strong>${t.status}</strong></li>`).join("") + "</ul>";

        const rejRes = await fetch(API+"/api/plugins/rejected",{headers:{"x-api-key":KEY}});
        const rejData = await rejRes.json();
        document.getElementById("rejected").innerHTML = "<h3>Rejections</h3>" +
            rejData.map(r => `<div>${r.name}: ${r.error}</div>`).join("");

        fetchLogs();
    } catch (e) {}
}

setInterval(refresh,5000);
loadNodes().then(refresh);
</script>

</body>
</html>
