name: Build NeuroStack OS

on:
  push:
    branches: [ Main ]
  pull_request:
    branches: [ Main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Run Build (Archive)
      run: |
        mkdir -p build
        tar -czf neurostack-os.tar.gz . --exclude="build" --exclude=".git" --exclude=".github"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: neurostack-os
        path: neurostack-os.tar.gz
