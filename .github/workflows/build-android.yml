name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          cd remote-control
          npm install

      - name: Capacitor Update & Build
        run: |
          cd remote-control
          npx cap add android || true
          npx cap sync

      - name: Build Android Project
        run: |
          cd remote-control/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NeuroStack-Remote-APK
          path: remote-control/android/app/build/outputs/apk/debug/app-debug.apk
