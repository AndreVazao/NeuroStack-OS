name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm install

      - name: Compile with pkg
        run: |
          cd backend
          npx pkg . --targets node20-win-x64 --output ../neurostack-backend.exe

      - name: Create Inno Setup script
        run: |
          echo '[Setup]' > neurostack.iss
          echo 'AppName=NeuroStack OS' >> neurostack.iss
          echo 'AppVersion=1.0' >> neurostack.iss
          echo 'DefaultDirName={pf}\NeuroStackOS' >> neurostack.iss
          echo 'DefaultGroupName=NeuroStack OS' >> neurostack.iss
          echo 'OutputDir=.' >> neurostack.iss
          echo 'OutputBaseFilename=NeuroStackSetup' >> neurostack.iss
          echo 'Compression=lzma' >> neurostack.iss
          echo 'SolidCompression=yes' >> neurostack.iss
          echo '[Files]' >> neurostack.iss
          echo 'Source: "neurostack-backend.exe"; DestDir: "{app}"' >> neurostack.iss
          echo 'Source: "frontend\*"; DestDir: "{app}\frontend"; Flags: recursesubdirs' >> neurostack.iss
          echo '[Icons]' >> neurostack.iss
          echo 'Name: "{group}\NeuroStack OS"; Filename: "{app}\neurostack-backend.exe"' >> neurostack.iss

      - name: Compile Installer
        uses: joncloud/makensis-action@v4
        with:
          script-file: neurostack.iss

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeuroStack-Windows-Installer
          path: NeuroStackSetup.exe
