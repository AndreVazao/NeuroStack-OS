name: Build Windows EXE

on:
  push:
    branches: [ Main ]
  workflow_dispatch:

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm install

      - name: Compile with pkg
        run: |
          cd backend
          npx pkg . --targets node20-win-x64 --output ../neurostack-backend.exe

      - name: Create NSIS script
        run: |
          echo '!include "MUI2.nsh"' > neurostack.nsi
          echo 'Name "NeuroStack OS"' >> neurostack.nsi
          echo 'OutFile "NeuroStackSetup.exe"' >> neurostack.nsi
          echo 'InstallDir "$PROGRAMFILES64\NeuroStackOS"' >> neurostack.nsi
          echo 'Section "MainSection" SEC01' >> neurostack.nsi
          echo '  SetOutPath "$INSTDIR"' >> neurostack.nsi
          echo '  File "neurostack-backend.exe"' >> neurostack.nsi
          echo '  SetOutPath "$INSTDIR\frontend"' >> neurostack.nsi
          echo '  File /r "frontend\*"' >> neurostack.nsi
          echo '  SetOutPath "$INSTDIR\plugins"' >> neurostack.nsi
          echo '  File /r "plugins\*"' >> neurostack.nsi
          echo '  CreateShortcut "$DESKTOP\NeuroStack OS.lnk" "$INSTDIR\neurostack-backend.exe"' >> neurostack.nsi
          echo 'SectionEnd' >> neurostack.nsi
        shell: bash

      - name: Compile Installer
        uses: joncloud/makensis-action@v4
        with:
          script-file: neurostack.nsi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeuroStack-Windows-Installer
          path: NeuroStackSetup.exe
