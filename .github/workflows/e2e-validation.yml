name: E2E & Validation

on:
  push:
    branches: [ Main ]
  pull_request:
    branches: [ Main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm install

      - name: Run Tests
        run: |
          cd backend
          npm test

      - name: Start Services & Health Check
        run: |
          cd backend
          export NEUROSTACK_API_KEY=neurostack-key
          node server.js &
          sleep 5
          curl -f -H "x-api-key: neurostack-key" http://localhost:3001/health
